<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MyRace – Einheit erledigt</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/myrace/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ff5a5c}a:hover{color:#ff8587}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">

  <div style="display: flex; justify-content: center; padding-top: 10px;"><div style="width: 36px; height: 5px; border-radius: 3px; background: var(--surface-3);"></div></div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 20px;">

    <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="min-width: 0;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px; line-height: 18px; color: var(--ink-3);">Mi, 14. Okt · Grundlage</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--status-good-tint); color: var(--status-good); font-size: 12px; line-height: 16px; font-weight: 600;">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Erledigt</span>
        </div>
        <h1 style="margin: 4px 0 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em;">Steady-State Lauf</h1>
      </div>
      <button type="button" aria-label="Schließen" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--surface-1); color: var(--ink-2); display: flex; align-items: center; justify-content: center;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </header>

    <section style="background: var(--surface-1); border-radius: 24px; padding: 20px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <span style="font-family: var(--font-rounded); font-variant-numeric: tabular-nums; font-size: 52px; line-height: 54px; font-weight: 700; letter-spacing: -0.02em;">10,4</span>
          <span style="font-size: 17px; font-weight: 600; color: var(--ink-3);">km</span>
        </div>
        <span style="font-size: 13px; line-height: 18px; color: var(--ink-3);">Plan 10,0 km</span>
      </div>
      <div style="height: 4px; border-radius: 8px; background: var(--surface-3); margin-top: 14px; overflow: hidden;"><div style="width: 100%; height: 100%; background: var(--status-good);"></div></div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px;">
        <div>
          <div style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-3);">Zeit</div>
          <div style="font-family: var(--font-rounded); font-variant-numeric: tabular-nums; font-size: 20px; line-height: 26px; font-weight: 600; margin-top: 4px;">52:10</div>
        </div>
        <div>
          <div style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-3);">Ø Pace</div>
          <div style="font-family: var(--font-rounded); font-variant-numeric: tabular-nums; font-size: 20px; line-height: 26px; font-weight: 600; margin-top: 4px;">5:01<span style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-3);"> /km</span></div>
        </div>
        <div>
          <div style="font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-3);">Ø Puls</div>
          <div style="font-family: var(--font-rounded); font-variant-numeric: tabular-nums; font-size: 20px; line-height: 26px; font-weight: 600; margin-top: 4px;">141<span style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-3);"> bpm</span></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; line-height: 18px; color: var(--ink-2);">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--status-good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        <span style="flex: 1;">Sauber in Zone 2 gelaufen</span>
        <span style="color: var(--ink-3);">Apple Health</span>
      </div>
    </section>

    <section>
      <h2 style="margin: 0 0 10px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-3);">Dein Eintrag</h2>
      <div style="background: var(--surface-1); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 15px; line-height: 20px; color: var(--ink-2);">Gefühl</span>
          <span style="font-family: var(--font-rounded); font-size: 17px; font-weight: 600;">4<span style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-3);"> / 5 · leicht</span></span>
        </div>
        <p style="margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 15px; line-height: 22px; color: var(--ink-2);">Lief rund, letzte zwei Kilometer etwas zu schnell.</p>
      </div>
    </section>

    <div style="background: var(--surface-1); border-radius: 18px; overflow: hidden;">
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 52px; padding: 0 16px; border: 0; background: transparent; color: var(--ink); font: 500 15px/20px var(--font-sans); text-align: left;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>
        <span style="flex: 1;">Geplanter Ablauf</span>
        <span style="font-size: 13px; color: var(--ink-3);">2 + 7 + 1 km</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 52px; padding: 0 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 15px/20px var(--font-sans); text-align: left;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
        <span style="flex: 1;">Mit Coach besprechen</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 52px; padding: 0 16px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 15px/20px var(--font-sans); text-align: left;">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>
        <span style="flex: 1;">Eintrag bearbeiten</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</body>
</html>
