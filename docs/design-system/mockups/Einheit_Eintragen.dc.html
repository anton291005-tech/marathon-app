<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MyRace – Einheit eintragen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/myrace/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ff5a5c}a:hover{color:#ff8587}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface-0); color: var(--ink); font-family: var(--font-sans);">

  <div aria-hidden="true" style="padding: 38px 16px 0; opacity: 0.35;">
    <div style="font-size: 13px; line-height: 18px; color: var(--ink-3);">Mi, 14. Okt · Grundlage · Woche 1</div>
    <div style="margin-top: 4px; font-size: 28px; line-height: 34px; font-weight: 700;">Steady-State Lauf</div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);"></div>

  <section aria-label="Einheit eintragen" style="position: absolute; left: 0; right: 0; bottom: 0; top: 118px; background: var(--surface-1); border-radius: 28px 28px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding-top: 10px;"><div style="width: 36px; height: 5px; border-radius: 3px; background: var(--surface-3);"></div></div>

    <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 22px;">
      <header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
        <div>
          <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">Einheit eintragen</h1>
          <div style="font-size: 13px; line-height: 18px; color: var(--ink-3); margin-top: 2px;">Steady-State Lauf · Plan 10,0 km</div>
        </div>
        <button type="button" aria-label="Schließen" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </header>

      <div style="background: var(--surface-2); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); color: var(--ink-2); display: flex; align-items: center; justify-content: center;">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; line-height: 20px; font-weight: 600;">Lauf aus Apple Health</div>
          <div style="font-size: 13px; line-height: 18px; color: var(--ink-3);">Heute 07:12 · 10,4 km · 52:10</div>
        </div>
        <button type="button" style="flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--ink); color: var(--surface-0); font: 600 14px/20px var(--font-sans);">Übernehmen</button>
      </div>

      <div>
        <label for="km" style="display: block; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-3); margin-bottom: 8px;">Distanz</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <button type="button" aria-label="Weniger" style="flex: none; width: 52px; height: 56px; border: 0; border-radius: 14px; background: var(--surface-2); color: var(--ink); font: 600 22px/1 var(--font-sans);">−</button>
          <div style="flex: 1; height: 56px; border-radius: 14px; background: var(--surface-2); display: flex; align-items: baseline; justify-content: center; gap: 4px; padding-top: 8px; box-sizing: border-box;">
            <input id="km" value="10,0" inputmode="decimal" style="width: 90px; border: 0; background: transparent; color: var(--ink); text-align: right; font-family: var(--font-rounded); font-variant-numeric: tabular-nums; font-size: 32px; line-height: 38px; font-weight: 700; outline: none;">
            <span style="font-size: 15px; font-weight: 600; color: var(--ink-3);">km</span>
          </div>
          <button type="button" aria-label="Mehr" style="flex: none; width: 52px; height: 56px; border: 0; border-radius: 14px; background: var(--surface-2); color: var(--ink); font: 600 22px/1 var(--font-sans);">+</button>
        </div>
      </div>

      <fieldset style="border: 0; margin: 0; padding: 0;">
        <legend style="font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-3); margin-bottom: 8px; padding: 0;">Wie hat es sich angefühlt?</legend>
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
          <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font: 600 17px/22px var(--font-rounded);">1</button>
          <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font: 600 17px/22px var(--font-rounded);">2</button>
          <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font: 600 17px/22px var(--font-rounded);">3</button>
          <button type="button" aria-pressed="true" style="height: 48px; border: 0; border-radius: 12px; background: var(--ink); color: var(--surface-0); font: 700 17px/22px var(--font-rounded);">4</button>
          <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font: 600 17px/22px var(--font-rounded);">5</button>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--ink-3);"><span>Sehr schwer</span><span>Sehr leicht</span></div>
      </fieldset>

      <div>
        <label for="notiz" style="display: block; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-3); margin-bottom: 8px;">Notiz <span style="font-weight: 400;">(optional)</span></label>
        <textarea id="notiz" rows="2" placeholder="Wie lief es? Besonderheiten?" style="width: 100%; box-sizing: border-box; border: 0; border-radius: 14px; background: var(--surface-2); color: var(--ink); padding: 14px 16px; font: 400 15px/22px var(--font-sans); resize: none; outline: none;"></textarea>
      </div>
    </div>

    <div style="margin-top: auto; padding: 12px 20px 34px;">
      <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: 600 17px/22px var(--font-sans);">Speichern</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
